<style>
  :root {
    /* ブランドカラー #3A2D25 を基調に、生成りの紙面を組み立てる */
    --brand: #3A2D25;
    --bg: #FAF7F2;          /* 生成り */
    --surface: #FFFFFF;
    --surface2: #F2EDE4;
    --border: #E4DACB;
    --rule: #D8CCBA;
    --text: #3A2D25;
    --text-muted: #8A7A6B;
    --accent: #8C6B3F;      /* 真鍮 — 時刻や強調に少量だけ */
    --radius: 4px;
    --tag-h: 34px;
    --measure: 1060px;

    --serif: 'Hiragino Mincho ProN', 'Yu Mincho', YuMincho, 'Noto Serif JP', Georgia, 'Times New Roman', serif;
    --sans: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Segoe UI', system-ui, sans-serif;

    /* 楽団の色は ORCHES（JS側）で定義。ここは参考値ではなく実体を持たない */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.75;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  /* ── Header ── */
  header {
    padding: 56px 24px 40px;
    border-bottom: 1px solid var(--rule);
    background: var(--bg);
  }

  .header-inner {
    max-width: var(--measure);
    margin: 0 auto;
    position: relative;
  }

  .top-nav {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
    margin-bottom: 28px;
  }

  .nav-link {
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    text-decoration: none;
    padding: 6px 4px;
    margin-right: 8px;
    border-bottom: 1px solid transparent;
    transition: color .2s, border-color .2s;
  }
  .nav-link:hover { color: var(--brand); border-bottom-color: var(--rule); }

  /* ロゴは明版。白基調のため白ヌキ版は使わない */
  .brand { text-align: center; }

  .site-logo {
    display: block;
    width: clamp(230px, 54vw, 360px);
    height: auto;
    margin: 0 auto 20px;
  }

  .site-title {
    font-family: var(--serif);
    font-size: clamp(14px, 3.4vw, 17px);
    font-weight: 400;
    letter-spacing: 0.18em;
    color: var(--text-muted);
  }
  .site-title span { display: block; margin-top: 4px; letter-spacing: 0.14em; }

  .stats {
    font-family: var(--serif);
    color: var(--text-muted);
    font-size: 12.5px;
    letter-spacing: 0.06em;
    margin-top: 18px;
  }
  .stats strong { color: var(--brand); font-weight: 600; }

  /* Lang toggle */
  .lang-btn {
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--text-muted);
    padding: 5px 13px;
    border-radius: 2px;
    cursor: pointer;
    font-family: var(--sans);
    font-size: 11.5px;
    letter-spacing: 0.08em;
    transition: all .2s;
  }
  .lang-btn.active { background: var(--brand); border-color: var(--brand); color: var(--bg); }
  .lang-btn:hover:not(.active) { border-color: var(--brand); color: var(--brand); }

  /* ── Filters（スクロール追従） ── */
  .filter-bar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(250, 247, 242, .93);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--rule);
    padding: 16px 24px;
  }

  .filters {
    max-width: var(--measure);
    margin: 0 auto;
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
  }

  .filter-label {
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .filter-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    flex: 1;
  }

  .chip {
    height: var(--tag-h);
    padding: 0 14px;
    border-radius: 2px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    font-family: var(--sans);
    font-size: 12px;
    letter-spacing: 0.02em;
    white-space: nowrap;
    transition: all .18s;
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .chip:hover { border-color: var(--brand); color: var(--brand); }
  .chip.active {
    background: var(--brand);
    border-color: var(--brand);
    color: var(--bg);
  }
  .chip .count {
    font-size: 10.5px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .chip.active .count { color: rgba(250, 247, 242, .72); }

  /* ── Main ── */
  main {
    max-width: var(--measure);
    margin: 56px auto 88px;
    padding: 0 24px;
  }

  .no-result {
    text-align: center;
    padding: 96px 0;
    color: var(--text-muted);
    display: none;
    font-family: var(--serif);
  }
  .no-result svg { opacity: .25; margin-bottom: 16px; }

  /* ── Month group ── */
  .month-group { margin-bottom: 64px; }

  .month-heading {
    display: flex;
    align-items: baseline;
    gap: 14px;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 12px;
    margin-bottom: 24px;
  }
  .month-heading .month-en {
    font-family: var(--serif);
    font-size: clamp(19px, 3.6vw, 23px);
    letter-spacing: 0.08em;
    color: var(--brand);
  }
  .month-heading .month-count {
    margin-left: auto;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    white-space: nowrap;
  }

  /* ── Concert card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 14px;
    overflow: hidden;
    transition: border-color .2s, box-shadow .2s;
    display: grid;
    grid-template-columns: 4px 1fr;
  }
  .card:hover {
    border-color: var(--rule);
    box-shadow: 0 2px 14px rgba(58, 45, 37, .07);
  }

  .card-stripe { width: 4px; }

  .card-body {
    padding: 22px 26px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px 20px;
  }

  .card-left { min-width: 0; }

  .card-header {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .orch-tag {
    font-size: 10.5px;
    letter-spacing: 0.1em;
    padding: 3px 9px;
    border-radius: 2px;
    white-space: nowrap;
  }

  .date-block {
    display: flex;
    align-items: baseline;
    gap: 7px;
  }
  .date-day {
    font-family: var(--serif);
    font-size: 27px;
    line-height: 1;
    color: var(--brand);
    font-variant-numeric: tabular-nums;
  }
  .date-meta {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.35;
    letter-spacing: 0.04em;
  }

  .concert-time {
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.06em;
    font-variant-numeric: tabular-nums;
  }

  .detail-row {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    font-size: 14px;
    margin-top: 5px;
  }
  .detail-row .icon {
    color: var(--text-muted);
    flex-shrink: 0;
    font-size: 11px;
    letter-spacing: 0.1em;
    /* 「会場」と "Conductor" で必要幅が違うため、固定せず下限だけ揃える */
    min-width: 4.6em;
    padding-top: 3px;
  }
  .detail-row .val { min-width: 0; word-break: break-word; }
  .detail-row .val.muted { color: var(--text-muted); font-size: 13px; }

  .program-list {

    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--surface2);
  }
  .program-list li {
    padding: 2px 0 2px 1.1em;
    color: var(--text-muted);
    font-size: 12.5px;
    text-indent: -1.1em;
    line-height: 1.65;
  }
  .program-list li::before { content: '—\00a0'; color: var(--rule); }

  .card-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    gap: 8px;
    min-width: 96px;
  }

  .ticket-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--brand);
    padding: 8px 15px;
    border-radius: 2px;
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 0.1em;
    white-space: nowrap;
    transition: all .2s;
  }
  .ticket-btn:hover { background: var(--brand); border-color: var(--brand); color: var(--bg); }

  .about {

    scroll-margin-top: 72px;
    border-top: 1px solid var(--rule);
    background: var(--surface);
    padding: 88px 24px 96px;

  .about-inner {
    max-width: 640px;
    margin: 0 auto;
    font-family: var(--serif);
  }

  .about h2 {
    font-size: clamp(19px, 4vw, 24px);
    font-weight: 400;
    letter-spacing: 0.1em;
    text-align: center;
    margin-bottom: 12px;
  }

  .about-rule {
    width: 44px;
    height: 1px;
    background: var(--rule);
    margin: 0 auto 40px;
  }

  .about p {
    font-size: 15.5px;
    line-height: 2.15;
    letter-spacing: 0.03em;
    margin-bottom: 1.9em;
  }
  .about p:last-child { margin-bottom: 0; }
  .about p em { font-style: italic; }
  .about .lead { font-size: 17.5px; letter-spacing: 0.05em; }

  /* ── Footer ── */
  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 11.5px;
    letter-spacing: 0.05em;
    padding: 40px 24px 48px;
    border-top: 1px solid var(--rule);
    line-height: 2;
  }
  .footer-brand {
    font-family: var(--serif);
    font-size: 13px;
    letter-spacing: 0.16em;
    color: var(--brand);
    display: block;
    margin-bottom: 10px;

  /* ── Responsive ── */
  @media (max-width: 640px) {
    body { font-size: 14px; }
    header { padding: 32px 18px 26px; }

    main { padding: 0 18px; margin: 36px auto 60px; }
    .card-body { grid-template-columns: 1fr; padding: 18px 18px; }
    .card-right { flex-direction: row; justify-content: flex-start; margin-top: 14px; align-items: center; }
    .date-day { font-size: 23px; }
    .chip { height: 30px; padding: 0 11px; font-size: 11.5px; }
    .detail-row .icon { min-width: 4.2em; }
    .month-group { margin-bottom: 44px; }
    .about { padding: 56px 18px 60px; }
    .about p { font-size: 15px; line-height: 2; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  .card { animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
</style>

// ── State ──
let lang = 'ja';
let activeFilter = 'all';
let allConcerts = [];
let scrapedAt = '';

function t(key, ...args) {
  const fn = T[lang][key];
  return typeof fn === 'function' ? fn(...args) : fn;
}

// ── Render ──
function render() {
  const L = T[lang];

  // Update static labels
  document.getElementById('filter-label').textContent = L.filterLabel;
  document.getElementById('no-result-text').textContent = L.noResult;
  document.getElementById('footer-text').textContent = L.footer + (scrapedAt ? ' | ' + L.scrapedAt(scrapedAt) : '');
  document.getElementById('subtitle-ja').style.display = lang === 'ja' ? 'block' : 'none';
  document.getElementById('subtitle-en').style.display = lang === 'en' ? 'block' : 'none';
  document.getElementById('btn-ja').classList.toggle('active', lang === 'ja');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');

  // About（本文は静的な自前テキストなので em を活かすため innerHTML で入れる）
  document.getElementById('nav-about').textContent = L.navAbout;
  document.getElementById('about-title').textContent = L.aboutTitle;
  document.getElementById('about-body').innerHTML =
    L.aboutBody.map((para, i) => `<p${i === 0 ? ' class="lead"' : ''}>${para}</p>`).join('');

  // 支援技術と検索エンジンに正しい言語を伝える
  document.documentElement.lang = lang;

  // Filter concerts
  const filtered = activeFilter === 'all'
    ? allConcerts
    : allConcerts.filter(c => c.orchestra === activeFilter);

  document.getElementById('stats-text').innerHTML = L.statsActive(filtered.length, allConcerts.length);

  // Rebuild chips
  buildChips();

  // Group by month
  const groups = {};
  filtered.forEach(c => {
    const d = new Date(c.date + 'T00:00:00');
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if (!groups[key]) groups[key] = [];
    groups[key].push(c);
  });

  const listEl = document.getElementById('list');
  const noResult = document.getElementById('no-result');

  if (filtered.length === 0) {
    listEl.innerHTML = '';
    noResult.style.display = 'block';
    return;
  }
  noResult.style.display = 'none';

  const keys = Object.keys(groups).sort();
  listEl.innerHTML = keys.map(key => {
    const [yr, mo] = key.split('-').map(Number);
    const monthLabel = lang === 'ja'
      ? `<span class="month-en">${yr}年${L.months(mo)}</span>`
      : `<span class="month-en">${L.months(mo)} ${yr}</span>`;

    const cards = groups[key].map(c => buildCard(c)).join('');
    return `
      <div class="month-group">
        <div class="month-heading">
          ${monthLabel}
          <span class="month-count">${groups[key].length} ${lang==='ja'?'件':'concerts'}</span>
        </div>
        ${cards}
      </div>`;
  }).join('');
}

function buildCard(c) {
  const o = getOrch(c.orchestra);
  const d = new Date(c.date + 'T00:00:00');
  const wd = T[lang].weekdays[d.getDay()];
  const month = T[lang].months(d.getMonth()+1);
  const day = d.getDate();
  const year = d.getFullYear();

  const orchName = lang === 'ja' ? o.ja : o.en;

  // Venue
  const venueText = c.venue
    ? `<div class="detail-row"><span class="icon">${T[lang].venue}</span><span class="val">${esc(c.venue)}</span></div>`
    : `<div class="detail-row"><span class="icon">${T[lang].venue}</span><span class="val muted">${T[lang].noVenue}</span></div>`;

  // Conductor
  const conductorText = c.conductor
    ? `<div class="detail-row"><span class="icon">${T[lang].conductor}</span><span class="val">${esc(c.conductor)}</span></div>`
    : '';

  // Program
  let programHtml = '';
  const progs = (c.program || []).filter(p => p && p.trim().length > 3).slice(0, 4);
  if (progs.length > 0) {
    programHtml = `<ul class="program-list">${progs.map(p => `<li>${esc(truncate(p, 70))}</li>`).join('')}</ul>`;
  }

  // Time
  const timeHtml = c.time
    ? `<span class="concert-time">${esc(c.time)}</span>`
    : '';

  // Ticket
  const ticketHtml = c.ticket_url
    ? `<a class="ticket-btn" href="${esc(c.ticket_url)}" target="_blank" rel="noopener">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 5v2M15 11v2M15 17v2M5 5h14a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3a2 2 0 0 0 0-4V7a2 2 0 0 1 2-2z"/></svg>
        ${T[lang].ticket}
       </a>`
    : '';

  return `
  <div class="card" data-orch="${esc(c.orchestra)}">
    <div class="card-stripe" style="background:${o.color}"></div>
    <div class="card-body">
      <div class="card-left">
        <div class="card-header">
          <span class="orch-tag" style="background:${o.color}14;color:${o.color}">${esc(orchName)}</span>
          <div class="date-block">
            <span class="date-day">${day}</span>
            <span class="date-meta">${month}<br>${wd} ${year}</span>
          </div>
          ${timeHtml}
        </div>
        ${venueText}
        ${conductorText}
        ${programHtml}
      </div>
      <div class="card-right">
        ${ticketHtml}
      </div>
    </div>
  </div>`;
}

function buildChips() {
  const L = T[lang];
  const counts = {};
  allConcerts.forEach(c => { counts[c.orchestra] = (counts[c.orchestra] || 0) + 1; });

  const allChip = `<button class="chip ${activeFilter==='all'?'active':''}" onclick="setFilter('all')">
    ${L.all} <span class="count">${allConcerts.length}</span>
  </button>`;

  const orchChips = ORCHES.filter(o => counts[o.ja]).map(o => {
    const active = activeFilter === o.ja ? 'active' : '';
    const name = lang === 'ja' ? o.ja : o.en;
    return `<button class="chip ${active}" onclick="setFilter('${esc(o.ja)}')"
      style="${active?'':''}">
      ${esc(name)} <span class="count">${counts[o.ja]||0}</span>
    </button>`;
  }).join('');

  document.getElementById('chips').innerHTML = allChip + orchChips;
}

// ── Helpers ──
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function truncate(s, n) {
  return s.length > n ? s.slice(0, n) + '…' : s;
}

function setLang(l) {
  lang = l;
  render();
}

function setFilter(f) {
  activeFilter = f;
  render();
}

// ── Init ──
(async () => {
  const data = await loadData();
  allConcerts = (data.concerts || []).sort((a, b) => a.date.localeCompare(b.date));
  scrapedAt = data.scraped_at || '';
  render();
})();
</script>
</body>
</html>
