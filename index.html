<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>東京オーケストラ コンサート情報 / Tokyo Orchestra Concerts</title>
<style>
  :root {
    --bg: #0f0f14;
    --surface: #1a1a24;
    --surface2: #22222f;
    --border: #2e2e42;
    --accent: #c8a96e;
    --accent2: #8b6fd4;
    --text: #e8e8f0;
    --text-muted: #888899;
    --radius: 10px;
    --tag-h: 36px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Segoe UI', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: linear-gradient(135deg, #1a1228 0%, #0f1a2e 100%);
    border-bottom: 1px solid var(--border);
    padding: 24px 20px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }

  .header-inner {
    max-width: 960px;
    margin: 0 auto;
  }

  .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .site-title {
    font-size: clamp(16px, 4vw, 22px);
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--accent);
  }
  .site-title span { color: var(--text-muted); font-weight: 400; font-size: 0.75em; display: block; margin-top: 2px; }

  .header-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* Lang toggle */
  .lang-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
    transition: all .2s;
  }
  .lang-btn.active { background: var(--accent); border-color: var(--accent); color: #1a1000; }
  .lang-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

  /* Stats badge */
  .stats {
    color: var(--text-muted);
    font-size: 12px;
    margin-top: 8px;
  }
  .stats strong { color: var(--accent); }

  /* ── Filters ── */
  .filters {
    max-width: 960px;
    margin: 16px auto 0;
    padding: 0 20px;
  }

  .filter-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .filter-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .chip {
    height: var(--tag-h);
    padding: 0 14px;
    border-radius: 18px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-muted);
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    transition: all .2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #1a1000;
    font-weight: 700;
  }
  .chip .count {
    background: rgba(0,0,0,.25);
    border-radius: 10px;
    padding: 1px 7px;
    font-size: 11px;
  }
  .chip.active .count { background: rgba(0,0,0,.2); }

  /* ── Main ── */
  main {
    max-width: 960px;
    margin: 24px auto 60px;
    padding: 0 20px;
  }

  /* No-result */
  .no-result {
    text-align: center;
    padding: 60px 0;
    color: var(--text-muted);
    display: none;
  }
  .no-result svg { opacity: .3; margin-bottom: 12px; }

  /* ── Month group heading ── */
  .month-group { margin-bottom: 32px; }

  .month-heading {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
    margin-bottom: 12px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .month-heading .month-en { font-size: 18px; color: var(--text); }
  .month-heading .month-count { margin-left: auto; font-size: 11px; }

  /* ── Concert card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 10px;
    overflow: hidden;
    transition: border-color .2s, transform .15s;
    display: grid;
    grid-template-columns: 5px 1fr;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); }

  /* left accent stripe = orchestra color */
  .card-stripe { width: 5px; }

  .card-body {
    padding: 14px 16px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 12px;
  }

  .card-left { min-width: 0; }

  .card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }

  .orch-tag {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 4px;
    white-space: nowrap;
  }

  .date-block {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .date-day {
    font-size: 22px;
    font-weight: 800;
    line-height: 1;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .date-meta {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.3;
  }

  .concert-time {
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .detail-row {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    font-size: 13px;
    margin-top: 4px;
    color: var(--text);
  }
  .detail-row .icon { color: var(--text-muted); flex-shrink: 0; margin-top: 2px; }
  .detail-row .val { min-width: 0; word-break: break-word; }
  .detail-row .val.muted { color: var(--text-muted); font-size: 12px; }

  .program-list {
    list-style: none;
    margin-top: 2px;
  }
  .program-list li {
    padding: 1px 0;
    color: var(--text-muted);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .program-list li::before { content: '♩ '; color: var(--border); }

  /* Ticket button */
  .card-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    gap: 8px;
    min-width: 90px;
  }

  .ticket-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 6px 12px;
    border-radius: 20px;
    text-decoration: none;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    white-space: nowrap;
    transition: all .2s;
  }
  .ticket-btn:hover { background: var(--accent); color: #1a1000; }

  /* ── Orchestra colors ── */
  :root {
    --c0: #e8a040; /* NHK */
    --c1: #5ba8e8; /* TPO */
    --c2: #52c279; /* TSO */
    --c3: #e85b8a; /* TMSO */
    --c4: #a855f7; /* NJP */
    --c5: #f97316; /* Yomikyo */
    --c6: #14b8a6; /* JapanPhil */
    --c7: #e84040; /* CityPhil */
  }

  /* ── Footer ── */
  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 11px;
    padding: 20px;
    border-top: 1px solid var(--border);
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    header { padding: 16px 16px 12px; }
    .filters { padding: 0 16px; }
    main { padding: 0 16px; margin-top: 16px; }
    .card-body { grid-template-columns: 1fr; }
    .card-right { flex-direction: row; justify-content: flex-start; margin-top: 10px; align-items: center; }
    .date-day { font-size: 18px; }
    .chip { height: 30px; padding: 0 10px; font-size: 11px; }
    .program-list li { white-space: normal; }
  }

  /* ── Transition for filter ── */
  .card { animation: fadeIn .2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>

  { ja: 'NHK交響楽団',                  en: 'NHK Symphony',        short: 'NHK',   color: 'var(--c0)' },
  { ja: '東京フィルハーモニー交響楽団',  en: 'Tokyo Phil',          short: 'TPO',   color: 'var(--c1)' },
  { ja: '東京交響楽団',                  en: 'Tokyo Symphony',      short: 'TSO',   color: 'var(--c2)' },
  { ja: '東京都交響楽団',                en: 'Tokyo Metro SO',      short: 'TMSO',  color: 'var(--c3)' },
  { ja: '新日本フィルハーモニー交響楽団',en: 'New Japan Phil',      short: 'NJP',   color: 'var(--c4)' },
  { ja: '読売日本交響楽団',              en: 'Yomiuri Nippon SO',   short: 'YNSO',  color: 'var(--c5)' },
  { ja: '日本フィルハーモニー交響楽団',  en: 'Japan Phil',          short: 'JapPO', color: 'var(--c6)' },
  { ja: '東京シティ・フィルハーモニック管弦楽団', en: 'Tokyo City Phil', short: 'TCPO', color: 'var(--c7)' },

function getOrch(name) {
  return ORCHES.find(o => o.ja === name) || { ja: name, en: name, short: name.slice(0,4), color: '#888' };
}

// ── I18n ──
const T = {
  ja: {
    filterLabel: '楽団で絞り込み',
    all: 'すべて',
    statsActive: (n, t) => `<strong>${n}</strong> 件 / 全 <strong>${t}</strong> 件`,
    ticket: 'チケット',
    venue: '会場',
    conductor: '指揮',
    program: '曲目',
    noVenue: '会場未定',
    noConductor: '指揮者未定',
    noProgram: '曲目未定',
    noResult: '該当するコンサートが見つかりませんでした',
    footer: 'データ取得: concerts.json | このページはスクレイピングデータに基づく参考情報です',
    scrapedAt: at => `取得日時: ${new Date(at).toLocaleString('ja-JP')}`,
    weekdays: ['日','月','火','水','木','金','土'],
    months: m => `${m}月`,
  },
  en: {
    filterLabel: 'Filter by orchestra',
    all: 'All',
    statsActive: (n, t) => `Showing <strong>${n}</strong> of <strong>${t}</strong> concerts`,
    ticket: 'Tickets',
    venue: 'Venue',
    conductor: 'Conductor',
    program: 'Program',
    noVenue: 'Venue TBD',
    noConductor: 'TBD',
    noProgram: 'TBD',
    noResult: 'No concerts found.',
    footer: 'Data source: concerts.json | This page is for reference only.',
    scrapedAt: at => `Last updated: ${new Date(at).toLocaleString('en-US')}`,
    weekdays: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],
    months: m => ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m] || m,
  }
};

// ── State ──
let lang = 'ja';
let activeFilter = 'all';
let allConcerts = [];
let scrapedAt = '';

function t(key, ...args) {
  const fn = T[lang][key];
  return typeof fn === 'function' ? fn(...args) : fn;
}

// ── Render ──
function render() {
  const L = T[lang];

  // Update static labels
  document.getElementById('filter-label').textContent = L.filterLabel;
  document.getElementById('no-result-text').textContent = L.noResult;
  document.getElementById('footer-text').textContent = L.footer + (scrapedAt ? ' | ' + L.scrapedAt(scrapedAt) : '');
  document.getElementById('subtitle-en').style.display = lang === 'en' ? 'block' : 'none';
  document.getElementById('btn-ja').classList.toggle('active', lang === 'ja');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');

  // Filter concerts
  const filtered = activeFilter === 'all'
    ? allConcerts
    : allConcerts.filter(c => c.orchestra === activeFilter);

  document.getElementById('stats-text').innerHTML = L.statsActive(filtered.length, allConcerts.length);

  // Rebuild chips
  buildChips();

  // Group by month
  const groups = {};
  filtered.forEach(c => {
    const d = new Date(c.date + 'T00:00:00');
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if (!groups[key]) groups[key] = [];
    groups[key].push(c);
  });

  const listEl = document.getElementById('list');
  const noResult = document.getElementById('no-result');

  if (filtered.length === 0) {
    listEl.innerHTML = '';
    noResult.style.display = 'block';
    return;
  }
  noResult.style.display = 'none';

  const keys = Object.keys(groups).sort();
  listEl.innerHTML = keys.map(key => {
    const [yr, mo] = key.split('-').map(Number);
    const monthLabel = lang === 'ja'
      ? `<span class="month-en">${yr}年${L.months(mo)}</span>`
      : `<span class="month-en">${L.months(mo)} ${yr}</span>`;

    const cards = groups[key].map(c => buildCard(c)).join('');
    return `
      <div class="month-group">
        <div class="month-heading">
          ${monthLabel}
          <span class="month-count">${groups[key].length} ${lang==='ja'?'件':'concerts'}</span>
        </div>
        ${cards}
      </div>`;
  }).join('');
}

function buildCard(c) {
  const o = getOrch(c.orchestra);
  const d = new Date(c.date + 'T00:00:00');
  const wd = T[lang].weekdays[d.getDay()];
  const month = T[lang].months(d.getMonth()+1);
  const day = d.getDate();
  const year = d.getFullYear();

  const orchName = lang === 'ja' ? o.ja : o.en;

  // Venue
  const venueText = c.venue
    ? `<div class="detail-row"><span class="icon">🏛</span><span class="val">${esc(c.venue)}</span></div>`
    : `<div class="detail-row"><span class="icon">🏛</span><span class="val muted">${T[lang].noVenue}</span></div>`;

  // Conductor
  const conductorText = c.conductor
    ? `<div class="detail-row"><span class="icon">🎼</span><span class="val">${esc(c.conductor)}</span></div>`
    : '';

  // Program
  let programHtml = '';
  const progs = (c.program || []).filter(p => p && p.trim().length > 3).slice(0, 4);
  if (progs.length > 0) {
    programHtml = `<ul class="program-list">${progs.map(p => `<li>${esc(truncate(p, 70))}</li>`).join('')}</ul>`;
  }

  // Time
  const timeHtml = c.time
    ? `<span class="concert-time">🕐 ${esc(c.time)}</span>`
    : '';

  // Ticket
  const ticketHtml = c.ticket_url
    ? `<a class="ticket-btn" href="${esc(c.ticket_url)}" target="_blank" rel="noopener">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 5v2M15 11v2M15 17v2M5 5h14a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3a2 2 0 0 0 0-4V7a2 2 0 0 1 2-2z"/></svg>
        ${T[lang].ticket}
       </a>`
    : '';

  return `
  <div class="card" data-orch="${esc(c.orchestra)}">
    <div class="card-stripe" style="background:${o.color}"></div>
    <div class="card-body">
      <div class="card-left">
        <div class="card-header">
          <span class="orch-tag" style="background:${o.color}22;color:${o.color}">${esc(orchName)}</span>
          <div class="date-block">
            <span class="date-day">${day}</span>
            <span class="date-meta">${month}<br>${wd} ${year}</span>
          </div>
          ${timeHtml}
        </div>
        ${venueText}
        ${conductorText}
        ${programHtml}
      </div>
      <div class="card-right">
        ${ticketHtml}
      </div>
    </div>
  </div>`;
}

function buildChips() {
  const L = T[lang];
  const counts = {};
  allConcerts.forEach(c => { counts[c.orchestra] = (counts[c.orchestra] || 0) + 1; });

  const allChip = `<button class="chip ${activeFilter==='all'?'active':''}" onclick="setFilter('all')">
    ${L.all} <span class="count">${allConcerts.length}</span>
  </button>`;

  const orchChips = ORCHES.filter(o => counts[o.ja]).map(o => {
    const active = activeFilter === o.ja ? 'active' : '';
    const name = lang === 'ja' ? o.ja : o.en;
    return `<button class="chip ${active}" onclick="setFilter('${esc(o.ja)}')"
      style="${active?'':''}">
      ${esc(name)} <span class="count">${counts[o.ja]||0}</span>
    </button>`;
  }).join('');

  document.getElementById('chips').innerHTML = allChip + orchChips;
}

// ── Helpers ──
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function truncate(s, n) {
  return s.length > n ? s.slice(0, n) + '…' : s;
}

function setLang(l) {
  lang = l;
  render();
}

function setFilter(f) {
  activeFilter = f;
  render();
}

// ── Init ──
(async () => {
  const data = await loadData();
  allConcerts = (data.concerts || []).sort((a, b) => a.date.localeCompare(b.date));
  scrapedAt = data.scraped_at || '';
  render();
})();
</script>
</body>
</html>
