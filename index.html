<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Musikverein.Tokyo — 東京のオーケストラ公演情報 / Tokyo Orchestra Concerts</title>
<meta name="description" content="東京の主要オーケストラの公演情報を一望できるガイド。Concert listings for Tokyo's professional orchestras.">
<style>
  :root {
    /* ブランドカラー #3A2D25 を基調に、生成りの紙面を組み立てる */
    --brand: #3A2D25;
    --bg: #FAF7F2;          /* 生成り */
    --surface: #FFFFFF;
    --surface2: #F2EDE4;
    --border: #E4DACB;
    --rule: #D8CCBA;
    --text: #3A2D25;
    --text-muted: #8A7A6B;
    --accent: #8C6B3F;      /* 真鍮 — 時刻や強調に少量だけ */
    --radius: 4px;
    --tag-h: 34px;
    --measure: 1060px;

    --serif: 'Hiragino Mincho ProN', 'Yu Mincho', YuMincho, 'Noto Serif JP', Georgia, 'Times New Roman', serif;
    --sans: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Segoe UI', system-ui, sans-serif;

    /* 楽団の色は ORCHES（JS側）で定義。ここは参考値ではなく実体を持たない */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.75;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  /* ── Header ── */
  header {
    padding: 56px 24px 40px;
    border-bottom: 1px solid var(--rule);
    background: var(--bg);
  }

  .header-inner {
    max-width: var(--measure);
    margin: 0 auto;
    position: relative;
  }

  .top-nav {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
    margin-bottom: 28px;
  }

  .nav-link {
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    text-decoration: none;
    padding: 6px 4px;
    margin-right: 8px;
    border-bottom: 1px solid transparent;
    transition: color .2s, border-color .2s;
  }
  .nav-link:hover { color: var(--brand); border-bottom-color: var(--rule); }

  /* ロゴは明版。白基調のため白ヌキ版は使わない */
  .brand { text-align: center; }

  .site-logo {
    display: block;
    width: clamp(258px, 62vw, 440px);
    height: auto;
    margin: 0 auto 20px;
  }

  .site-title {
    font-family: var(--serif);
    font-size: clamp(14px, 3.4vw, 17px);
    font-weight: 400;
    letter-spacing: 0.18em;
    color: var(--text-muted);
  }
  .site-title span { display: block; margin-top: 4px; letter-spacing: 0.14em; }

  .stats {
    font-family: var(--serif);
    color: var(--text-muted);
    font-size: 12.5px;
    letter-spacing: 0.06em;
    margin-top: 18px;
  }
  .stats strong { color: var(--brand); font-weight: 600; }

  .date-range {
    font-family: var(--serif);
    font-size: 11.5px;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-top: 8px;
  }

  /* Lang toggle */
  .lang-btn {
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--text-muted);
    padding: 5px 13px;
    border-radius: 2px;
    cursor: pointer;
    font-family: var(--sans);
    font-size: 11.5px;
    letter-spacing: 0.08em;
    transition: all .2s;
  }
  .lang-btn.active { background: var(--brand); border-color: var(--brand); color: var(--bg); }
  .lang-btn:hover:not(.active) { border-color: var(--brand); color: var(--brand); }

  /* ── Filters（スクロール追従） ── */
  .filter-bar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(250, 247, 242, .93);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--rule);
    padding: 16px 24px;
  }

  .filters {
    max-width: var(--measure);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .filter-row {
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
  }

  /* 検索窓はチップと同じ調子（細い罫線・角丸2px）で控えめに */
  .filter-search {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: 420px;
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: var(--surface);
    padding: 0 12px;
    height: var(--tag-h);
    transition: border-color .2s;
  }
  .filter-search:focus-within { border-color: var(--brand); }

  .search-icon { display: flex; color: var(--text-muted); flex-shrink: 0; }
  .filter-search:focus-within .search-icon { color: var(--brand); }

  #search {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    font-family: var(--sans);
    font-size: 13px;
    color: var(--text);
    padding: 0;
  }
  #search::placeholder { color: var(--text-muted); opacity: .85; }
  /* ブラウザ既定の×は自前のものと重なるので消す */
  #search::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }

  #search-clear {
    border: 0;
    background: transparent;
    color: var(--text-muted);
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
    padding: 0 2px;
    flex-shrink: 0;
  }
  #search-clear:hover { color: var(--brand); }

  .search-count {
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    white-space: nowrap;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  .filter-label {
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .filter-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    flex: 1;
  }

  .chip {
    height: var(--tag-h);
    padding: 0 14px;
    border-radius: 2px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    font-family: var(--sans);
    font-size: 12px;
    letter-spacing: 0.02em;
    white-space: nowrap;
    transition: all .18s;
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .chip:hover { border-color: var(--brand); color: var(--brand); }
  .chip.active {
    background: var(--brand);
    border-color: var(--brand);
    color: var(--bg);
  }
  .chip .count {
    font-size: 10.5px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  /* 検索で該当が無くなった楽団。並びは保ったまま、選べないことを示す */
  .chip.empty { opacity: .38; }
  .chip.empty:hover { border-color: var(--border); color: var(--text-muted); }
  .chip.active .count { color: rgba(250, 247, 242, .72); }

  /* ── Main ── */
  main {
    max-width: var(--measure);
    margin: 56px auto 88px;
    padding: 0 24px;
  }

  .no-result {
    text-align: center;
    padding: 96px 0;
    color: var(--text-muted);
    display: none;
    font-family: var(--serif);
  }
  .no-result svg { opacity: .25; margin-bottom: 16px; }

  /* ── Month group ── */
  .month-group { margin-bottom: 64px; }

  .month-heading {
    display: flex;
    align-items: baseline;
    gap: 14px;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 12px;
    margin-bottom: 24px;
  }
  .month-heading .month-en {
    font-family: var(--serif);
    font-size: clamp(19px, 3.6vw, 23px);
    letter-spacing: 0.08em;
    color: var(--brand);
  }
  .month-heading .month-count {
    margin-left: auto;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    white-space: nowrap;
  }

  /* ── Concert card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 14px;
    overflow: hidden;
    transition: border-color .2s, box-shadow .2s;
    display: grid;
    grid-template-columns: 4px 1fr;
  }
  .card:hover {
    border-color: var(--rule);
    box-shadow: 0 2px 14px rgba(58, 45, 37, .07);
  }

  .card-stripe { width: 4px; }

  .card-body {
    padding: 22px 26px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px 20px;
  }

  .card-left { min-width: 0; }

  .card-header {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .orch-tag {
    font-size: 10.5px;
    letter-spacing: 0.1em;
    padding: 3px 9px;
    border-radius: 2px;
    white-space: nowrap;
  }

  .date-block {
    display: flex;
    align-items: baseline;
    gap: 7px;
  }
  .date-day {
    font-family: var(--serif);
    font-size: 27px;
    line-height: 1;
    color: var(--brand);
    font-variant-numeric: tabular-nums;
  }
  .date-meta {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.35;
    letter-spacing: 0.04em;
  }

  .concert-time {
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.06em;
    font-variant-numeric: tabular-nums;
  }

  .detail-row {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    font-size: 14px;
    margin-top: 5px;
  }
  .detail-row .icon {
    color: var(--text-muted);
    flex-shrink: 0;
    font-size: 11px;
    letter-spacing: 0.1em;
    /* 「会場」と "Conductor" で必要幅が違うため、固定せず下限だけ揃える */
    min-width: 4.6em;
    padding-top: 3px;
  }
  .detail-row .val { min-width: 0; word-break: break-word; }
  .detail-row .val.muted { color: var(--text-muted); font-size: 13px; }

  .program-list {
    list-style: none;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--surface2);
  }
  .program-list li {
    padding: 2px 0 2px 1.1em;
    color: var(--text-muted);
    font-size: 12.5px;
    text-indent: -1.1em;
    line-height: 1.65;
  }
  .program-list li::before { content: '—\00a0'; color: var(--rule); }

  /* Ticket button */
  .card-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    gap: 8px;
    min-width: 96px;
  }

  .ticket-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--brand);
    padding: 8px 15px;
    border-radius: 2px;
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 0.1em;
    white-space: nowrap;
    transition: all .2s;
  }
  .ticket-btn:hover { background: var(--brand); border-color: var(--brand); color: var(--bg); }

  /* ── About ── */
  .about {
    /* 追従するフィルタバーの下にアンカー先が潜り込まないように */
    scroll-margin-top: 72px;
    border-top: 1px solid var(--rule);
    background: var(--surface);
    padding: 88px 24px 96px;
  }

  .about-inner {
    max-width: 640px;
    margin: 0 auto;
    font-family: var(--serif);
  }

  .about h2 {
    font-size: clamp(19px, 4vw, 24px);
    font-weight: 400;
    letter-spacing: 0.1em;
    text-align: center;
    margin-bottom: 12px;
  }

  .about-rule {
    width: 44px;
    height: 1px;
    background: var(--rule);
    margin: 0 auto 40px;
  }

  .about p {
    font-size: 15.5px;
    line-height: 2.15;
    letter-spacing: 0.03em;
    margin-bottom: 1.9em;
  }
  .about p:last-child { margin-bottom: 0; }
  .about p em { font-style: italic; }
  .about .lead { font-size: 17.5px; letter-spacing: 0.05em; }

  /* ── Back to top ── */
  /* 罫線と角丸2pxはチケットボタンと同じ調子。浮いた印象にならないよう
     地色は紙面と同じ生成りにし、影はごく薄く */
  .to-top {
    position: fixed;
    right: 26px;
    bottom: 26px;
    z-index: 90;
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: 2px;
    color: var(--brand);
    cursor: pointer;
    box-shadow: 0 1px 8px rgba(58, 45, 37, .06);
    opacity: 0;
    visibility: hidden;
    transform: translateY(6px);
    transition: opacity .28s ease, transform .28s ease, visibility .28s,
                background-color .2s, border-color .2s, color .2s;
  }
  .to-top.visible { opacity: 1; visibility: visible; transform: translateY(0); }
  .to-top:hover { background: var(--brand); border-color: var(--brand); color: var(--bg); }
  .to-top:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  @media (max-width: 640px) {
    .to-top { right: 16px; bottom: 16px; width: 42px; height: 42px; }
  }

  /* ── Footer ── */
  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 11.5px;
    letter-spacing: 0.05em;
    padding: 40px 24px 48px;
    border-top: 1px solid var(--rule);
    line-height: 2;
  }
  .footer-brand {
    font-family: var(--serif);
    font-size: 13px;
    letter-spacing: 0.16em;
    color: var(--brand);
    display: block;
    margin-bottom: 10px;
  }
  #footer-text { display: block; }
  .footer-operator {
    display: inline-block;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-family: var(--serif);
    font-size: 11.5px;
    letter-spacing: 0.14em;
    line-height: 2.1;
    color: var(--text-muted);
  }
  #footer-updated {
    display: block;
    margin-top: 14px;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    opacity: .75;
  }

  /* ── Responsive ── */
  @media (max-width: 640px) {
    body { font-size: 14px; }
    header { padding: 32px 18px 26px; }
    .top-nav { margin-bottom: 20px; }
    .filter-bar { padding: 12px 18px; }
    .filters { gap: 10px; }
    .filter-search { max-width: none; }
    .filter-row { gap: 10px; }
    main { padding: 0 18px; margin: 36px auto 60px; }
    .card-body { grid-template-columns: 1fr; padding: 18px 18px; }
    .card-right { flex-direction: row; justify-content: flex-start; margin-top: 14px; align-items: center; }
    .date-day { font-size: 23px; }
    .chip { height: 30px; padding: 0 11px; font-size: 11.5px; }
    .detail-row .icon { min-width: 4.2em; }
    .month-group { margin-bottom: 44px; }
    .about { padding: 56px 18px 60px; }
    .about p { font-size: 15px; line-height: 2; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  .card { animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
</style>

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
</head>
<body>

<header>
  <div class="header-inner">
    <nav class="top-nav">
      <a class="nav-link" id="nav-about" href="#about">このサイトについて</a>
      <button class="lang-btn active" id="btn-ja" onclick="setLang('ja')">日本語</button>
      <button class="lang-btn" id="btn-en" onclick="setLang('en')">English</button>
    </nav>
    <div class="brand">
      <img class="site-logo" src="assets/logo-horizontal.svg"
           alt="Musikverein.Tokyo" width="456" height="73">
      <div class="site-title">
        <span id="subtitle-ja">東京のオーケストラ公演情報</span>
        <span id="subtitle-en" style="display:none">Tokyo Orchestra Concert Guide</span>
      </div>
      <div class="stats">
        <span id="stats-text"></span>
      </div>
      <div class="date-range" id="date-range"></div>
    </div>
  </div>
</header>

<div class="filter-bar">
  <div class="filters">
    <div class="filter-search">
      <span class="search-icon" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </span>
      <input type="search" id="search" autocomplete="off" spellcheck="false"
             placeholder="曲名・作曲家・指揮者・会場で検索" aria-label="検索">
      <button type="button" id="search-clear" aria-label="検索条件をクリア" hidden>×</button>
      <span class="search-count" id="search-count" hidden></span>
    </div>
    <div class="filter-row">
      <div class="filter-label" id="filter-label">楽団で絞り込み</div>
      <div class="filter-chips" id="chips"></div>
    </div>
  </div>
</div>

<main id="main">
  <div class="no-result" id="no-result">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <p id="no-result-text">該当するコンサートが見つかりませんでした</p>
  </div>
  <div id="list"></div>
</main>

<section class="about" id="about">
  <div class="about-inner">
    <h2 id="about-title"></h2>
    <div class="about-rule"></div>
    <div id="about-body"></div>
  </div>
</section>

<footer>
  <span class="footer-brand" id="footer-brand">Musikverein.Tokyo ─ 東京楽友協会</span>
  <span id="footer-text"></span>
  <span class="footer-operator">
    Operated by Musikverein Tokyo<br>
    Supported by INTERTEXT INC.
  </span>
  <span id="footer-updated"></span>
</footer>

<button class="to-top" id="to-top" type="button" onclick="scrollToTop()" aria-label="ページ上部へ戻る">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
</button>

<script>

// ── State ──
let lang = 'ja';
let activeFilter = 'all';
let allConcerts = [];
let scrapedAt = '';
let query = '';

function t(key, ...args) {
  const fn = T[lang][key];
  return typeof fn === 'function' ? fn(...args) : fn;
}

// ── Search ──
// 日本語表示のまま "Brahms"、英語表示のまま「ブラームス」で引けるように、
// 日英どちらの表記も同じ索引に入れる。
// 揺れの吸収は次の3点。いずれも検索語と索引の両方に同じ処理をかける。
//   ・ラテン文字の分音記号を外す（Dvorak で Dvořák に当てる）
//   ・ひらがなをカタカナに寄せる（ぶらーむす → ブラームス）
//   ・全角と半角、大文字と小文字を揃える
const LATIN_LIGATURES = { 'ø': 'o', 'æ': 'ae', 'ß': 'ss', 'ł': 'l', 'đ': 'd', 'þ': 'th' };

function searchKey(text) {
  return String(text || '')
    .normalize('NFKC')
    .toLowerCase()
    // ラテン文字だけを分解して結合記号を落とす（日本語の濁点は保つ）
    .replace(/[\u00c0-\u024f]/g, ch =>
      LATIN_LIGATURES[ch] || ch.normalize('NFD').replace(/[\u0300-\u036f]/g, ''))
    // ひらがな → カタカナ
    .replace(/[\u3041-\u3096]/g, ch => String.fromCharCode(ch.charCodeAt(0) + 0x60));
}

function buildSearchIndex(c) {
  const o = getOrch(c.orchestra);
  return searchKey([
    o.ja, o.en, o.short,
    c.venue, c.venue_en,
    c.conductor, c.conductor_en,
    ...(c.program || []),
    ...(c.program_en || []),
  ].filter(Boolean).join(' '));
}

// 語句として一致する公演があればそれを優先し、無ければ語ごとのAND検索に落とす。
// AND だけだと "New World" が「New Japan Phil ＋ World Premiere」にも当たる。
let queryTest = () => true;

function updateQueryTest() {
  const key = searchKey(query).replace(/\s+/g, ' ').trim();
  if (!key) { queryTest = () => true; return; }
  allConcerts.forEach(c => { if (c._index === undefined) c._index = buildSearchIndex(c); });
  if (allConcerts.some(c => c._index.includes(key))) {
    queryTest = c => c._index.includes(key);
  } else {
    const words = key.split(' ');
    queryTest = c => words.every(w => c._index.includes(w));
  }
}

function matchesQuery(c) {
  return query ? queryTest(c) : true;
}

// ── Render ──
function render() {
  const L = T[lang];

  // Update static labels
  document.getElementById('filter-label').textContent = L.filterLabel;
  document.getElementById('no-result-text').textContent = L.noResult;
  document.getElementById('footer-brand').textContent = L.footerBrand;
  document.getElementById('footer-text').textContent = L.footer;
  document.getElementById('footer-updated').textContent = scrapedAt ? L.scrapedAt(scrapedAt) : '';
  document.getElementById('subtitle-ja').style.display = lang === 'ja' ? 'block' : 'none';
  document.getElementById('subtitle-en').style.display = lang === 'en' ? 'block' : 'none';
  document.getElementById('btn-ja').classList.toggle('active', lang === 'ja');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');

  // About（本文は静的な自前テキストなので em を活かすため innerHTML で入れる）
  document.getElementById('nav-about').textContent = L.navAbout;
  document.getElementById('to-top').setAttribute('aria-label', L.toTop);
  document.getElementById('about-title').textContent = L.aboutTitle;
  document.getElementById('about-body').innerHTML =
    L.aboutBody.map((para, i) => `<p${i === 0 ? ' class="lead"' : ''}>${para}</p>`).join('');

  // 支援技術と検索エンジンに正しい言語を伝える
  document.documentElement.lang = lang;

  // 楽団の絞り込みと検索は併用する
  const filtered = allConcerts
    .filter(c => activeFilter === 'all' || c.orchestra === activeFilter)
    .filter(matchesQuery);

  // 絞り込んでいないときに「227件 / 全227件」と出すのは冗長なので総数だけ
  // 掲載期間はデータから求めるので、毎月の自動更新で自然に追従する
  const rangeEl = document.getElementById('date-range');
  const dates = allConcerts.map(c => c.date).filter(Boolean).sort();
  rangeEl.textContent = dates.length
    ? L.dateRange(new Date(dates[0] + 'T00:00:00'), new Date(dates[dates.length - 1] + 'T00:00:00'))
    : '';

  const narrowed = activeFilter !== 'all' || Boolean(query);
  document.getElementById('stats-text').innerHTML = narrowed
    ? L.statsActive(filtered.length, allConcerts.length)
    : L.statsAll(allConcerts.length);

  // 検索窓まわり（追従バーの中なので、スクロール中も件数が見える）
  const searchEl = document.getElementById('search');
  searchEl.placeholder = L.searchPlaceholder;
  searchEl.setAttribute('aria-label', L.searchLabel);
  const clearEl = document.getElementById('search-clear');
  clearEl.setAttribute('aria-label', L.searchClear);
  clearEl.hidden = !query;
  const countEl = document.getElementById('search-count');
  countEl.hidden = !query;
  countEl.textContent = query ? L.searchCount(filtered.length) : '';

  document.getElementById('no-result-text').textContent =
    query ? L.noSearchResult : L.noResult;

  // Rebuild chips
  buildChips();

  // Group by month
  const groups = {};
  filtered.forEach(c => {
    const d = new Date(c.date + 'T00:00:00');
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if (!groups[key]) groups[key] = [];
    groups[key].push(c);
  });

  const listEl = document.getElementById('list');
  const noResult = document.getElementById('no-result');

  if (filtered.length === 0) {
    listEl.innerHTML = '';
    noResult.style.display = 'block';
    return;
  }
  noResult.style.display = 'none';

  const keys = Object.keys(groups).sort();
  listEl.innerHTML = keys.map(key => {
    const [yr, mo] = key.split('-').map(Number);
    const monthLabel = lang === 'ja'
      ? `<span class="month-en">${yr}年${L.months(mo)}</span>`
      : `<span class="month-en">${L.months(mo)} ${yr}</span>`;

    const cards = groups[key].map(c => buildCard(c)).join('');
    return `
      <div class="month-group">
        <div class="month-heading">
          ${monthLabel}
          <span class="month-count">${groups[key].length} ${lang==='ja'?'件':'concerts'}</span>
        </div>
        ${cards}
      </div>`;
  }).join('');
}

function buildCard(c) {
  const o = getOrch(c.orchestra);
  const d = new Date(c.date + 'T00:00:00');
  const wd = T[lang].weekdays[d.getDay()];
  const month = T[lang].months(d.getMonth()+1);
  const day = d.getDate();
  const year = d.getFullYear();

  const orchName = lang === 'ja' ? o.ja : o.en;

  // Venue
  // 英語表示では venue_en を使う。訳が無い場合は日本語のまま出す
  // （空欄にするより、原語で読めた方が手がかりになる）
  const venueLabel = lang === 'en' ? (c.venue_en || c.venue) : c.venue;
  const venueText = venueLabel
    ? `<div class="detail-row"><span class="icon">${T[lang].venue}</span><span class="val">${esc(venueLabel)}</span></div>`
    : `<div class="detail-row"><span class="icon">${T[lang].venue}</span><span class="val muted">${T[lang].noVenue}</span></div>`;

  // Conductor
  const conductorLabel = lang === 'en' ? (c.conductor_en || c.conductor) : c.conductor;
  const conductorText = conductorLabel
    ? `<div class="detail-row"><span class="icon">${T[lang].conductor}</span><span class="val">${esc(conductorLabel)}</span></div>`
    : '';

  // Program
  // 英語表示では program_en を使う。訳の無い曲は日本語のまま出す
  let programHtml = '';
  const source = (c.program || []).map((p, i) =>
    lang === 'en' ? ((c.program_en || [])[i] || p) : p);
  const progs = source.filter(p => p && p.trim().length > 3).slice(0, 4);
  if (progs.length > 0) {
    programHtml = `<ul class="program-list">${progs.map(p => `<li>${esc(truncate(p, 78))}</li>`).join('')}</ul>`;
  }

  // Time
  const timeHtml = c.time
    ? `<span class="concert-time">${esc(c.time)}</span>`
    : '';

  // Ticket
  const ticketHtml = c.ticket_url
    ? `<a class="ticket-btn" href="${esc(c.ticket_url)}" target="_blank" rel="noopener">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 5v2M15 11v2M15 17v2M5 5h14a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3a2 2 0 0 0 0-4V7a2 2 0 0 1 2-2z"/></svg>
        ${T[lang].ticket}
       </a>`
    : '';

  return `
  <div class="card" data-orch="${esc(c.orchestra)}">
    <div class="card-stripe" style="background:${o.color}"></div>
    <div class="card-body">
      <div class="card-left">
        <div class="card-header">
          <span class="orch-tag" style="background:${o.color}14;color:${o.color}">${esc(orchName)}</span>
          <div class="date-block">
            <span class="date-day">${day}</span>
            <span class="date-meta">${month}<br>${wd} ${year}</span>
          </div>
          ${timeHtml}
        </div>
        ${venueText}
        ${conductorText}
        ${programHtml}
      </div>
      <div class="card-right">
        ${ticketHtml}
      </div>
    </div>
  </div>`;
}

function buildChips() {
  const L = T[lang];
  // 件数は検索結果に連動させるが、並び自体は全公演を基準に固定する。
  // 検索のたびにチップが消えると、他の楽団に切り替えられなくなるため。
  const counts = {}, totals = {};
  allConcerts.forEach(c => {
    totals[c.orchestra] = (totals[c.orchestra] || 0) + 1;
    if (matchesQuery(c)) counts[c.orchestra] = (counts[c.orchestra] || 0) + 1;
  });
  const matchedTotal = allConcerts.filter(matchesQuery).length;

  const allChip = `<button class="chip ${activeFilter==='all'?'active':''}" onclick="setFilter('all')">
    ${L.all} <span class="count">${matchedTotal}</span>
  </button>`;

  const orchChips = ORCHES.filter(o => totals[o.ja]).map(o => {
    const n = counts[o.ja] || 0;
    const cls = [activeFilter === o.ja ? 'active' : '', n === 0 ? 'empty' : ''].filter(Boolean).join(' ');
    const name = lang === 'ja' ? o.ja : o.en;
    return `<button class="chip ${cls}" onclick="setFilter('${esc(o.ja)}')">
      ${esc(name)} <span class="count">${n}</span>
    </button>`;
  }).join('');

  document.getElementById('chips').innerHTML = allChip + orchChips;
}

// ── Back to top ──
// スクロール毎の処理は rAF で1フレームに1回へ間引く
const TO_TOP_THRESHOLD = 600;
let toTopTicking = false;

function updateToTop() {
  const btn = document.getElementById('to-top');
  if (btn) btn.classList.toggle('visible', window.scrollY > TO_TOP_THRESHOLD);
  toTopTicking = false;
}

window.addEventListener('scroll', () => {
  if (toTopTicking) return;
  toTopTicking = true;
  requestAnimationFrame(updateToTop);
}, { passive: true });

function scrollToTop() {
  // 視差に敏感な利用者には一瞬で戻す
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
}

// ── Helpers ──
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function truncate(s, n) {
  return s.length > n ? s.slice(0, n) + '…' : s;
}

function setLang(l) {
  lang = l;
  render();
}

function setFilter(f) {
  activeFilter = f;
  render();
}

function setQuery(q) {
  query = q;
  updateQueryTest();
  render();
}

// 入力のたびに206件を描き直すと重いので、わずかに待ってからまとめて反映する
let searchTimer = null;
function onSearchInput(value) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => setQuery(value.trim()), 120);
}

// ── Init ──
(async () => {
  const data = await loadData();
  allConcerts = (data.concerts || []).sort((a, b) => a.date.localeCompare(b.date));
  scrapedAt = data.scraped_at || '';

  const searchEl = document.getElementById('search');
  searchEl.addEventListener('input', e => onSearchInput(e.target.value));
  searchEl.addEventListener('keydown', e => {
    if (e.key === 'Escape') { searchEl.value = ''; setQuery(''); }
  });
  document.getElementById('search-clear').addEventListener('click', () => {
    searchEl.value = '';
    setQuery('');
    searchEl.focus();
  });

  render();
  updateToTop();
})();
</script>
